# One command runs everything: relay, coordinator bot, and the web app behind HTTPS.
#   cp deploy/.env.example deploy/.env   (fill it in)
#   docker compose --env-file deploy/.env up -d --build
services:
  relay:
    image: scsibug/nostr-rs-relay:latest
    restart: unless-stopped
    volumes:
      - relay-data:/usr/src/app/db

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on: [relay]
    environment:
      BOT_NSEC: ${BOT_NSEC:?set BOT_NSEC in deploy/.env}
      RELAYS: ws://relay:8080
      ORGANIZERS: ${ORGANIZERS:-}
      GROUPS: ${GROUPS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      AI_REMINDER_LANGUAGES: ${AI_REMINDER_LANGUAGES:-en}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_COORDINATOR: ${COORDINATOR_NPUB:-}
    restart: unless-stopped
    depends_on: [relay]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data

volumes:
  relay-data:
  caddy-data:
